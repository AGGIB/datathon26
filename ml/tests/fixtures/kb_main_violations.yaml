ировки банкнот листы, неполные корешки, неполные пачки передаются для объединения и упаковки кассовым работникам. Кассовые работники полистно пересчитывают принятые для объединения банкноты и формируют из них полные корешки и пачки банкнот. Оставшиеся банкноты упаковываются в пачку, состоящую из банкнот разных номиналов. Банкноты в пачке обандероливаются одной общей бандеролью без оформления реквизитов, предусмотренных частью второй пункта 46 Правил. 50. Отдельные корешки с банкнотами упаковываются в неполные пачки одного номинала или в пачки с банкнотами разного номинала, в количестве не более десяти корешков в пачке, которая снабжается верхней и нижней накладками. На верхней накладке указываются наименование, банковский идентификационный код банка, количество и сумма банкнот каждого номинала, общая сумма вложенных банкнот, дата упаковки, штамп или код, а также подпись кассового работника, производившего пересчет, сортировку и упаковку банкнот. На пачках, состоящих из корешков или листов разного номинала, дополнительно проставляется штамп "Сборная".
