  missing_rule_changes_verdict: false
  general_applicability:
    - Критерии описывают только доступные наблюдению действия; окклюзия и действие вне фрагмента не доказывают отсутствия
      действия.
    - Роли, назначение помещения, стадия операции и исключения устанавливаются отдельно. Полномочия не определяются
      внешностью; распознавание и идентификация лиц запрещены кейсом.
    - Пороги и confidence — командные эвристики, не положения закона и не измеренные вероятности.
    - Обработка видео и кадров допускается только локально; облачным AI не передаются видео, кадры или их описания.
