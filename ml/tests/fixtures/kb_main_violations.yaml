        citation_status: citation_verified
        verification_scope: citation_and_source_integrity
        number_date: Постановление Правления Национального Банка Республики Казахстан от 29.11.2019 № 231 (рег.
          № 19680)
        clause_note: все четыре абзаца, включая возврат / невозврат по результатам экспертизы
        usage: exception
