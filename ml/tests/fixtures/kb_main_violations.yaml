  - id: no_visible_client_id_check
    codex_code: Т02
    name: Приём денег без видимой идентификации клиента
    analysis_name: Прием денег без видимой проверки личности клиента
    criterion: |-
      В полном доступном наблюдению цикле приёма денег не видны действия с удостоверяющим документом или сервисом цифровых документов. Одного отсутствия бумажного документа недостаточно.
    applicability:
      - Установлены приём наличных денег и роль кассового работника.
      - Различаются визуальная идентификация по №231 и комплексная AML-проверка; учитываются цифровые документы,
        иные источники и применимые AML-исключения.
    description_template: |-
      На {t} с: {observation}. Это может указывать на несоблюдение требования к визуальной идентификации клиента при подходящем контексте. Основание: {rule_document}, {rule_clause}.
    implementation_status: not_implemented
    normative_basis: contextual_reference
    rule:
      document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и
        ценностей в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе
        почты и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей
      source_id: NBRK-231
      clause: п.19 подп.1
      url: https://adilet.zan.kz/rus/docs/V1900019680#z444
      quote: |-
        19. Кассовый работник банка осуществляет следующие действия: 1) проводит визуальную идентификацию клиента, вносящего наличные деньги, с документом, удостоверяющим его личность, либо данными, подтверждающими (идентифицирующими) личность клиента, полученными посредством сервиса цифровых документов;
      verified_by: Codex (агент Олжаса), сверка официального текста
