  name: Дверь кассы оставлена открытой / нет видимого запирания
  analysis_name: Открытая дверь или отсутствие видимого запирания при уходе
  criterion: Дверь кассового помещения открыта не менее 5 секунд, пока кассир работает, ИЛИ кассир уходит без видимого запирания.
    Порог относится только к первой ветви.
  applicability:
  - Установлены дверь именно кассы, достаточный обзор и стадия работы / ухода кассира.
  - Для двери кассы используется временный п.16 подп.1 №14 до 01.01.2027; будущая более строгая редакция не применяется.
  - П.8 №14 относится к входу кассового узла; допускается дополнительный закрывающийся погрузочный вход.
  - 'Это косвенный индикатор: нормы описывают устройство входа, не обязательное закрытие каждую секунду и не срок 5 секунд.'
  - Пункт 8 относится к изоляции кассового узла; временный п.16 подп.1 — к входу отдельной кассы. Назначение наблюдаемой двери
    устанавливается отдельно; открытое состояние само по себе не доказывает нарушения устройства входа.
  description_template: 'На {t} с: {observation}. Это может указывать на несоблюдение требования об изолированности кассового
