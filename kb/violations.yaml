# К3 — каталог типов нарушений. Его читают пайплайн (ml/) и UI.
# Владельцы: Алпамыс — типы, признаки, шаблоны; Олжас — блок rule (нормы).
#
# Правила:
#   * id — латиница snake_case. После 17:30 не переименовываем: на него ссылается код.
#   * В description_template только то, что ВИДНО на видео. Никаких проводок, сверок, намерений.
#   * rule заполняется ТОЛЬКО по тексту НПА с adilet.zan.kz / nationalbank.kz:
#     точная цитата + URL. Не уверен в пункте → clause: null, ссылка на документ целиком.
#   * Тип без проверенной нормы (rule.verified_by пуст) пайплайн НЕ выдаёт.
#   * status: draft → ready (Алпамыс) → verified (Олжас).
#
# Плейсхолдеры в description_template: {t} — таймкод в секундах, {rule_document}, {rule_clause}.

version: 1

