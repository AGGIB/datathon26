      - document: Закон РК о ПОД/ФТ/ФРОМУ от 28.08.2009 №191-IV
        source_id: KZ-AML
        clause: ст.5 п.3-1, все случаи и исключения
        url: https://adilet.zan.kz/rus/docs/Z090000191_#z226
        quote: |-
          3-1. Меры, предусмотренные в настоящей статье, не принимаются в случаях: 1) при проведении следующих разовых операций: при осуществлении неидентифицированными владельцами электронных денег – физическими лицами операций по приобретению и использованию электронных денег, не превышающих сумму, предусмотренную пунктом 4 статьи 44 Закона Республики Казахстан "О платежах и платежных системах"; при осуществлении клиентом – физическим лицом операции по зачислению денег на банковский счет физического лица либо проведению платежа в пользу поставщика услуг посредством оборудования (устройства), предназначенного для приема наличных денег, если сумма такой операции не превышает 500000 тенге либо сумму в иностранной валюте, эквивалентную 500000 тенге; при осуществлении клиентом безналичного платежа или перевода денег без использования банковского счета, если сумма такого платежа или перевода денег не превышает 500000 тенге либо сумму в иностранной валюте, эквивалентную 500000 тенге, за исключением случаев совершения клиентом подозрительной операции; при осуществлении клиентом – физическим лицом операции по покупке, продаже или обмену наличной иностранной валюты в обменном пункте, если сумма такой операции не превышает 500000 тенге либо сумму в иностранной валюте, эквивалентную 500000 тенге, за исключением случаев совершения клиентом подозрительной операции; при осуществлении клиентом – физическим лицом операции с использованием платежной карточки, не являющейся средством доступа к банковскому счету такого клиента, если сумма такой операции не превышает 200000 тенге либо сумму в иностранной валюте, эквивалентную 200000 тенге; при осуществлении клиентом – физическим лицом операции по оплате задолженности в рамках исполнительного производства в пользу государственных органов посредством оборудования (устройства), предназначенного для приема наличных денег; при осуществлении клиентом – физическим лицом операции по покупке ювелирных изделий из драгоценных металлов и драгоценных камней в розницу, если сумма такой операции не превышает 500 000 тенге либо сумму в иностранной валюте, эквивалентную 500 000 тенге, за исключением случаев совершения клиентом подозрительной операции; при осуществлении клиентом – физическим лицом операции по покупке аффинированного золота в слитках через обменные пункты, если сумма такой операции не превышает 500 000 тенге, за исключением случаев совершения клиентом подозрительной операции; при осуществлении клиентом – физическим лицом операции по оплате страховой премии по договору страхования, если сумма такой операции не превышает 100 000 тенге либо сумму в иностранной валюте, эквивалентную 100 000 тенге, за исключением случаев совершения клиентом подозрительной операции; при осуществлении клиентом – физическим и (или) юридическим лицом операций по оплате страховой премии и получению страховой выплаты по договорам обязательного страхования; 2) исключен Законом РК от 01.07.2022 № 131-VII (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования). 3) исключен Законом РК от 01.07.2022 № 131-VII (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования).
        usage: supporting
