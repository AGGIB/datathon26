  - id: no_visible_client_id_check
    codex_code: Т02
    name: Приём денег без видимой идентификации клиента
    analysis_name: Прием денег без видимой проверки личности клиента
    criterion: |-
      В полном доступном наблюдению цикле приёма денег не видны действия с удостоверяющим документом или сервисом цифровых документов. Одного отсутствия бумажного документа недостаточно.
    applicability:
      - Установлены приём наличных денег и роль кассового работника.
      - Различаются визуальная идентификация по №231 и комплексная AML-проверка; учитываются цифровые документы,
        иные источники и применимые AML-исключения.
    description_template: |-
      При приёме денег действия с документом или сервисом цифровых документов не видны; это может указывать на несоблюдение требования к визуальной идентификации клиента при подходящем контексте.
    implementation_status: not_implemented
    normative_basis: contextual_reference
    rule:
      document: Правила кассовых операций и инкассации (НБРК, 29.11.2019 №231)
      source_id: NBRK-231
      clause: п.19 подп.1
      url: https://adilet.zan.kz/rus/docs/V1900019680#z444
      quote: |-
        1) проводит визуальную идентификацию клиента, вносящего наличные деньги, с документом, удостоверяющим его личность, либо данными, подтверждающими (идентифицирующими) личность клиента, полученными посредством сервиса цифровых документов;
      verified_by: Codex (агент Олжаса), сверка официального текста
      verified_on: '2026-10-17'
      citation_status: citation_verified
      verification_scope: citation_and_source_integrity
    limitations:
      - Отсутствие бумажного удостоверения не доказывает отсутствия идентификации.
      - Исключение AML само по себе не отменяет самостоятельную обязанность по №231 п.19 подп.1.
      - Кейс запрещает распознавание и идентификацию лиц; решение не выполняет сравнение лиц с документом.
    legal_analysis_id: Т02
    related_rules:
