# К3 — каталог типов нарушений. Его читают пайплайн (ml/) и UI.
# Владельцы: Алпамыс — типы, признаки, шаблоны; Олжас — блок rule (нормы).
#
# Правила:
#   * id — латиница snake_case. После 17:30 не переименовываем: на него ссылается код.
#   * В description_template только то, что ВИДНО на видео. Никаких проводок, сверок, намерений.
#   * rule заполняется ТОЛЬКО по тексту НПА с adilet.zan.kz / nationalbank.kz:
#     точная цитата + URL. Не уверен в пункте → clause: null, ссылка на документ целиком.
#   * Тип без проверенной нормы (rule.verified_by пуст) пайплайн НЕ выдаёт.
#   * status: draft → ready (Алпамыс) → verified (Олжас).
#
# Плейсхолдеры в description_template: {t} — таймкод в секундах, {rule_document}, {rule_clause}.

version: 1

violations:
  # ↓↓↓ ШАБЛОН — скопировать для каждого типа, сам шаблон потом удалить ↓↓↓
  - id: template_do_not_ship
    status: draft
    name: "Короткое название, как увидит проверяющий"
    summary: "Одна фраза: в чём нарушение"
    visible_signs:            # что конкретно видно в кадре
      - "..."
    detection_signals:        # что может поймать пайплайн: объекты, зоны, длительности
      - "..."
    timecode_rule: "Какой момент считаем таймкодом (для бездействия — когда действие должно было произойти)"
    min_duration_sec: null    # сколько секунд состояние должно длиться, чтобы считаться нарушением
    description_template: >-
      На {t} с <что видно>. <Почему это может быть нарушением>.
      Основание: {rule_document}, {rule_clause}.
    rule:
      document: null          # полное название НПА
      number_date: null       # «Постановление Правления НБРК от ДД.ММ.ГГГГ № N»
      clause: null            # «п. 12» / «гл. 3, п. 45»
      quote: null             # дословная цитата
      url: null               # ссылка adilet / nationalbank
      verified_by: null       # кто сверил цитату с текстом НПА
    examples: []              # [{video: "X-1", sec: 22}]
