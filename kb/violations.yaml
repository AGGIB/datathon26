      - document: Закон РК о ПОД/ФТ/ФРОМУ от 28.08.2009 №191-IV
        source_id: KZ-AML
        clause: ст.5 п.6, включая условия использования мер иных субъектов
        url: https://adilet.zan.kz/rus/docs/Z090000191_#z63
        quote: |-
          6. Субъекты финансового мониторинга, указанные в подпунктах 1) – 5), 11) и 12) пункта 1 статьи 3 настоящего Закона, могут полагаться на меры, предусмотренные подпунктами 1), 2), 2-1), 2-2), 4) и 6) пункта 3 настоящей статьи, принятые в отношении соответствующих клиентов (их представителей) и бенефициарных собственников другими субъектами финансового мониторинга, а также иностранными финансовыми организациями при соблюдении следующих условий: 1) субъект финансового мониторинга, который полагается на меры по надлежащей проверке, принятые другим субъектом финансового мониторинга или иностранной финансовой организацией, должен незамедлительно получать данные о клиенте (его представителе), бенефициарном собственнике, включая копии подтверждающих документов, в рамках мер, предусмотренных подпунктами 1), 2), 2-1), 2-2), 4) и 6) пункта 3 настоящей статьи; 2) субъект финансового мониторинга, который полагается на меры по надлежащей проверке клиента (его представителя) и бенефициарного собственника, принятые иностранной финансовой организацией, должен установить, что деятельность такой иностранной финансовой организации подлежит лицензированию, регулированию и надзору в государстве, в котором она зарегистрирована, и что такой субъект финансового мониторинга или иностранная финансовая организация принимает меры по надлежащей проверке клиента (его представителя) и бенефициарного собственника, аналогичные требованиям настоящей статьи, а также хранит документы и сведения, полученные по результатам надлежащей проверки, не менее пяти лет со дня прекращения деловых отношений с клиентом (его представителем) и бенефициарным собственником.
