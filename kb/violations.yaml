violations:
  - id: banknote_returned_after_check
    codex_code: Т01
    name: Возврат банкнот клиенту после проверки
    analysis_name: Возврат банкнот после проверки
    criterion: |-
      После наблюдаемой проверки кассовый работник возвращает банкноты клиенту; правовой статус банкнот и стадия экспертизы устанавливаются отдельно.
    applicability:
      - Установлены статус сомнительности / признаки подделки и стадия экспертизы, а не только действие возврата.
      - Проверены результаты экспертизы и применимость исключений возврата по п.59 и п.63.
    description_template: |-
      После проверки банкноты передаются обратно клиенту; это может указывать на несоблюдение требования к обращению с такими банкнотами при применимости соответствующего порядка.
    implementation_status: not_implemented
    normative_basis: contextual_reference
    rule:
      document: Правила кассовых операций и инкассации (НБРК, 29.11.2019 №231)
      source_id: NBRK-231
      clause: п.59, все четыре абзаца, включая возврат / невозврат по результатам экспертизы
      url: https://adilet.zan.kz/rus/docs/V1900019680#z198
      quote: |-
        59. При обнаружении сомнительных банкнот и монет кассовый работник в присутствии клиента и заведующего кассой или лица, осуществляющего его функции, составляет акт о приеме на экспертизу сомнительных банкнот и монет в двух экземплярах по форме, определенной банком самостоятельно, в котором указываются дата, фамилия, имя, отчество (при его наличии) кассового работника банка, обнаружившего сомнительные банкноты и монеты, фамилия, имя, отчество (при его наличии) клиента, номинал банкнот и монет, номера и серии банкнот, а также характерные признаки сомнительности банкнот и монет, один из которых остается в банке, второй выдается клиенту. Сомнительные банкноты и монеты в течение пяти рабочих дней направляются на экспертизу в филиал Национального Банка. В случае получении от филиала Национального Банка результатов экспертизы о признании банкнот и монет платежными, осуществляется возврат банкнот и монет клиенту на основании его экземпляра акта о приеме на экспертизу сомнительных банкнот и монет. В случае признания банкнот и монет неплатежными, банкноты и монеты возврату не подлежат, клиенту выдается результат экспертизы банкнот и монет.
      verified_by: Codex (агент Олжаса), сверка официального текста
      verified_on: '2026-10-17'
      citation_status: citation_verified
      verification_scope: citation_and_source_integrity
    limitations:
      - Возврат банкнот после проверки сам по себе допустим. Видео без достоверного статуса банкнот и результатов
        экспертизы не доказывает нарушение.
      - Нельзя определять подделку по общему внешнему виду или домысливать решение экспертизы.
    legal_analysis_id: Т01
    related_rules:
      - document: Правила кассовых операций и инкассации (НБРК, 29.11.2019 №231)
        source_id: NBRK-231
        clause: п.61
        url: https://adilet.zan.kz/rus/docs/V1900019680#z204
        quote: |-
          61. Банкноты и монеты, имеющие признаки подделки, клиенту не возвращаются, сумма принятых банкнот и монет на банковский счет клиента не зачисляется.
        usage: supporting
        verified_by: Codex (агент Олжаса), сверка официального текста
        verified_on: '2026-10-17'
        citation_status: citation_verified
        verification_scope: citation_and_source_integrity
      - document: Правила кассовых операций и инкассации (НБРК, 29.11.2019 №231)
        source_id: NBRK-231
        clause: п.63
        url: https://adilet.zan.kz/rus/docs/V1900019680#z206
        quote: |-
          63. При признании правоохранительными органами банкнот и монет подлинными, они подлежат передаче в банк для возврата клиенту, в случае признания их поддельными остаются в правоохранительных органах в качестве вещественных доказательств.
        usage: supporting
        verified_by: Codex (агент Олжаса), сверка официального текста
        verified_on: '2026-10-17'
        citation_status: citation_verified
        verification_scope: citation_and_source_integrity
